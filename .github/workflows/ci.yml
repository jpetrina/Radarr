name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build backend + frontend
        run: ./build.sh --backend --frontend --packages -f net8.0 -r linux-musl-x64

      - name: Create archive
        run: tar -czf Radarr.linux-musl-core-x64.tar.gz -C _artifacts/linux-musl-x64/net8.0 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radarr.linux-musl-core-x64.tar.gz
          path: Radarr.linux-musl-core-x64.tar.gz
